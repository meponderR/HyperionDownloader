name: Release

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: windows
                    - os: macos-latest
                      platform: darwin

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Install Linux Dependencies
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26" # Update to your specific Go version if needed
                  cache: true

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install Frontend Dependencies
              run: |
                  cd frontend
                  pnpm ci

            - name: Install NSIS
              if: matrix.platform == 'windows'
              uses: negrutiu/nsis-install@v2

            - name: Install Wails v3 CLI
              run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

            - name: Build Application (Windows)
              if: matrix.platform == 'windows'
              run: |
                  wails3 package GOOS=windows
                  mv bin/hyperion-downloader.exe bin/hyperion-downloader-amd64-windows.exe
                  mv bin/hyperion-downloader-amd64-installer.exe bin/hyperion-downloader-amd64-windows-installer.exe

                  wails3 package GOOS=windows GOARCH=arm64
                  mv bin/hyperion-downloader.exe bin/hyperion-downloader-arm64-windows.exe
                  mv bin/hyperion-downloader-arm64-installer.exe bin/hyperion-downloader-arm64-windows-installer.exe

            - name: Build Application (Linux)
              if: matrix.platform == 'linux'
              run: |
                  wails3 package GOOS=linux
                  mv bin/hyperion-downloader bin/hyperion-downloader-linux
                  mv bin/hyperion-downloader-x86_64.AppImage bin/hyperion-downloader-x86_64-linux.AppImage

                  wails3 package GOOS=linux GOARCH=arm64
                  mv bin/hyperion-downloader bin/hyperion-downloader-arm64-linux
                  mv bin/hyperion-downloader-aarch64.AppImage bin/hyperion-downloader-arm64-linux.AppImage
            #Universal binary
            - name: Build Application (macOS)
              if: matrix.platform == 'darwin'
              run: |
                  wails3 task package:universal
                  mv bin/hyperion-downloader.app bin/Hyperion\ Downloader.app
                  hdiutil create -volname "Hyperion Downloader" -srcfolder bin/Hyperion\ Downloader.app -ov -format UDZO bin/Hyperion-Downloader-macos.dmg
                  zip -r bin/hyperion-downloader-macos.zip bin/Hyperion\ Downloader.app

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: hyperion-downloader-${{ matrix.platform }}
                  path: |
                      bin/hyperion-downloader-amd64-windows.exe
                      bin/hyperion-downloader-arm64-windows.exe
                      bin/hyperion-downloader-amd64-windows-installer.exe
                      bin/hyperion-downloader-arm64-windows-installer.exe
                      bin/hyperion-downloader-linux
                      bin/hyperion-downloader-x86_64-linux.AppImage
                      bin/hyperion-downloader-arm64-linux
                      bin/hyperion-downloader-aarch64-linux.AppImage
                      bin/Hyperion-Downloader-macos.dmg
                      bin/hyperion-downloader-macos.zip

            - name: Create Release
              uses: softprops/action-gh-release@v3.0.0
              with:
                  files: |
                      bin/hyperion-downloader-amd64-windows.exe
                      bin/hyperion-downloader-arm64-windows.exe
                      bin/hyperion-downloader-amd64-windows-installer.exe
                      bin/hyperion-downloader-arm64-windows-installer.exe
                      bin/hyperion-downloader-linux
                      bin/hyperion-downloader-x86_64-linux.AppImage
                      bin/hyperion-downloader-arm64-linux
                      bin/hyperion-downloader-aarch64-linux.AppImage
                      bin/Hyperion-Downloader-macos.dmg
                      bin/hyperion-downloader-macos.zip
