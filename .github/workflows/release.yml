name: Release

on:
    push:
        tags:
            - "*.*.*"

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: windows
                    - os: macos-latest
                      platform: darwin

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Checkout Wails v3
              run: git clone --depth 1 https://github.com/wailsapp/wails.git ../wails

            - name: Install Linux Dependencies
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26"
                  cache: true

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install Frontend Dependencies
              run: |
                  cd frontend
                  pnpm ci

            - name: Install NSIS
              if: matrix.platform == 'windows'
              uses: negrutiu/nsis-install@v2

            - name: Install Wails v3 CLI
              run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

            - name: Import Certificate
              if: matrix.platform == 'darwin'
              env:
                  CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVID_CERTIFICATE }}
                  CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVID_CERTIFICATE_PASSWORD }}
              run: |
                  echo $CERTIFICATE_BASE64 | base64 --decode > certificate.p12
                  security create-keychain -p "" build.keychain
                  security default-keychain -s build.keychain
                  security unlock-keychain -p "" build.keychain
                  security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

            - name: Store Notarization Credentials
              if: matrix.platform == 'darwin'
              env:
                  APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
                  APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
                  APPLE_KEY: ${{ secrets.APPLE_KEY }}
              run: |
                  echo $APPLE_KEY | base64 --decode > AuthKey_${APPLE_KEY_ID}.p8
                  xcrun notarytool store-credentials "notarize-profile" \
                    --key "AuthKey_${APPLE_KEY_ID}.p8" \
                    --key-id "${APPLE_KEY_ID}" \
                    --issuer "${APPLE_ISSUER_ID}"

            - name: Build Application (Windows)
              if: matrix.platform == 'windows'
              run: |
                  wails3 package GOOS=windows
                  mv bin/hyperion-downloader.exe bin/hyperion-downloader-amd64-windows.exe
                  mv bin/hyperion-downloader-amd64-installer.exe bin/hyperion-downloader-amd64-windows-installer.exe

                  wails3 package GOOS=windows GOARCH=arm64
                  mv bin/hyperion-downloader.exe bin/hyperion-downloader-arm64-windows.exe
                  mv bin/hyperion-downloader-arm64-installer.exe bin/hyperion-downloader-arm64-windows-installer.exe

            - name: Build Application (Linux)
              if: matrix.platform == 'linux'
              run: |
                  wails3 package GOOS=linux
                  mv bin/hyperion-downloader bin/hyperion-downloader-linux-amd64 
                  mv bin/hyperion-downloader-x86_64.AppImage bin/hyperion-downloader-amd64-linux.AppImage

            - name: Build Application (macOS)
              if: matrix.platform == 'darwin'
              env:
                  SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
              run: |
                  wails3 task darwin:package:universal
                  wails3 task darwin:sign:notarize \
                    SIGN_IDENTITY="$SIGN_IDENTITY" \
                    KEYCHAIN_PROFILE="notarize-profile"
                  mv bin/hyperion-downloader.app bin/Hyperion\ Downloader.app
                  hdiutil create -volname "Hyperion Downloader" -srcfolder bin/Hyperion\ Downloader.app -ov -format UDZO bin/Hyperion-Downloader-macos.dmg
                  zip -r bin/hyperion-downloader-macos.zip bin/Hyperion\ Downloader.app

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: hyperion-downloader-${{ matrix.platform }}
                  path: |
                      bin/hyperion-downloader-amd64-windows.exe
                      bin/hyperion-downloader-arm64-windows.exe
                      bin/hyperion-downloader-amd64-windows-installer.exe
                      bin/hyperion-downloader-arm64-windows-installer.exe
                      bin/hyperion-downloader-linux
                      bin/hyperion-downloader-x86_64-linux.AppImage
                      bin/Hyperion-Downloader-macos.dmg
                      bin/hyperion-downloader-macos.zip

    checksum:
        name: Generate SHA256SUMS
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Create workspace directory
              run: mkdir bin

            - name: Download all artifacts
              uses: actions/download-artifact@v7
              with:
                  pattern: hyperion-downloader-*
                  path: bin
                  merge-multiple: true

            - name: Generate SHA256SUMS file
              run: |
                  cd bin
                  shasum -a 256 * > SHA256SUMS
                  cat SHA256SUMS

            - name: Upload SHA256SUMS Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: hyperion-downloader-checksums
                  path: bin/SHA256SUMS

    release:
        name: Create Release
        needs: checksum
        runs-on: ubuntu-latest
        steps:
            - name: Create release directory
              run: mkdir artifacts

            - name: Download all build binaries
              uses: actions/download-artifact@v7
              with:
                  pattern: hyperion-downloader-*
                  path: artifacts
                  merge-multiple: true

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  files: artifacts/*
