name: Nightly iOS

on:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    build:
        runs-on: macos-26

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26"
                  cache: true

            - name: Link Go for Xcode Build Scripts
              run: |
                  sudo mkdir -p /usr/local/go/bin
                  sudo ln -sf $(which go) /usr/local/go/bin/go

            - name: Setup Wails v3
              run: |
                  git clone https://github.com/wailsapp/wails.git ../wails
                  go mod edit -replace github.com/wailsapp/wails/v3=../wails/v3
                  go mod tidy
                  cd ../wails
                  git remote add fork https://github.com/meponderR/wails.git
                  git fetch fork
                  git merge fork/master
                  cd v3/cmd/wails3
                  go install

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install Frontend Dependencies
              run: |
                  cd frontend
                  pnpm ci

            - name: Import Certificate
              env:
                  CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
                  CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
                  PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
              run: |
                  # Certificate
                  echo $CERTIFICATE_BASE64 | base64 --decode > certificate.p12
                  security create-keychain -p "" build.keychain
                  security default-keychain -s build.keychain
                  security unlock-keychain -p "" build.keychain
                  security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

                  # Provisioning profile
                  PROVISIONING_PROFILE_PATH=$RUNNER_TEMP/HET-ASC.mobileprovision
                  echo $PROVISIONING_PROFILE_BASE64 | base64 --decode > $PROVISIONING_PROFILE_PATH
                  mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
                  cp $PROVISIONING_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

            - name: Set Xcode Build Number
              run: |
                  cd build/ios/xcode
                  xcrun agvtool new-version -all ${{ github.run_number }}

            - name: Build Archive
              run: |
                  xcodebuild archive \
                    -project build/ios/xcode/main.xcodeproj \
                    -scheme "Hyperion Downloader" \
                    -archivePath $PWD/build/HyperionDownloader.xcarchive \
                    -sdk iphoneos \
                    -configuration Release \
                    CODE_SIGN_STYLE=Manual \
                    DEVELOPMENT_TEAM=8H4KB9HHSC \
                    CODE_SIGN_IDENTITY="Apple Distribution" \
                    PROVISIONING_PROFILE_SPECIFIER="Hyperion Downloader App Store Connect" \
                    OTHER_CODE_SIGN_FLAGS="--keychain build.keychain"

            - name: Export IPA
              run: |
                  xcodebuild -exportArchive \
                    -archivePath $PWD/build/HyperionDownloader.xcarchive \
                    -exportOptionsPlist build/ios/xcode/ExportOptions.plist \
                    -exportPath $PWD/build/ipa

            - name: Upload to TestFlight
              uses: apple-actions/upload-testflight-build@v5
              with:
                  app-path: build/ipa/Hyperion Downloader.ipa
                  issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPLE_KEY_ID }}
                  api-private-key: ${{ secrets.APPLE_KEY_PLAIN }}
                  wait-for-processing: "true"

            - name: Distribute to TestFlight Nightly Group
              uses: kapilvats/testflight-distributor@v1
              with:
                  issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPLE_KEY_ID }}
                  api-private-key: ${{ secrets.APPLE_KEY_PLAIN }}
                  bundle-id: "com.meponder.hyperiondownloader"
                  build-number: ${{ github.run_number }}
                  group-name: "Nightly"
