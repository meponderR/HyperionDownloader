name: Nightly iOS (Unsigned)

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

jobs:
    build:
        runs-on: macos-26

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26" # Update to your specific Go version if needed
                  cache: true

            - name: Link Go for Xcode Build Scripts
              run: |
                  sudo mkdir -p /usr/local/go/bin
                  sudo ln -sf $(which go) /usr/local/go/bin/go

            - name: Setup Wails v3
              run: |
                  git clone https://github.com/wailsapp/wails.git ../wails
                  go mod edit -replace github.com/wailsapp/wails/v3=../wails/v3
                  go mod tidy
                  cd ../wails
                  git remote add fork https://github.com/meponderR/wails.git
                  git fetch fork
                  git merge fork/master
                  cd v3/cmd/wails3
                  go install

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install Frontend Dependencies
              run: |
                  cd frontend
                  pnpm ci

            - name: Set Xcode Build Number
              run: |
                  export BUILD_NUMBER=(${{ github.run_number }} + 14)
                  cd build/ios/xcode
                  xcrun agvtool new-version -all $BUILD_NUMBER

            - name: Build Archive
              run: |
                  xcodebuild archive \
                    -project build/ios/xcode/main.xcodeproj \
                    -scheme "Hyperion Downloader" \
                    -archivePath $PWD/build/HyperionDownloader.xcarchive \
                    -sdk iphoneos \
                    -configuration Release \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    DEVELOPMENT_TEAM=""

            - name: Export IPA
              run: |
                  xcodebuild -exportArchive \
                    -archivePath $PWD/build/HyperionDownloader.xcarchive \
                    -exportOptionsPlist build/ios/xcode/ExportOptions.plist \
                    -exportPath $PWD/build/ipa

            - name: Create unsigned IPA
              run: |
                  cd build
                  mkdir Payload
                  cp -R HyperionDownloader.xcarchive/Products/Applications/*.app Payload/
                  rm -rf Payload/*.app/SC_Info
                  zip -r HyperionDownloader-unsigned.ipa Payload

            - name: Upload IPA
              uses: actions/upload-artifact@v4
              with:
                  name: ios-unsigned-ipa
                  path: build/HyperionDownloader-unsigned.ipa
